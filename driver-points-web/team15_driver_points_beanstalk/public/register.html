<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .password-requirements {
      margin-top: 12px;
      padding: 12px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      display: none;
    }

    .password-requirements.show {
      display: block;
    }

    .requirement {
      display: flex;
      align-items: center;
      margin: 6px 0;
      font-size: 13px;
      color: var(--muted);
    }

    .requirement.met {
      color: #4ade80;
    }

    .requirement-icon {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 12px;
      font-weight: bold;
    }

    .requirement-icon.unmet {
      background: rgba(255, 180, 180, 0.3);
      color: var(--danger);
    }

    .requirement-icon.met {
      background: rgba(74, 222, 128, 0.3);
      color: #4ade80;
    }

    .strength-meter {
      margin-top: 12px;
      display: none;
    }

    .strength-meter.show {
      display: block;
    }

    .strength-bar {
      width: 100%;
      height: 6px;
      background: rgba(38, 52, 88, 0.8);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      background: #ef4444;
      border-radius: 3px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .strength-fill.weak {
      background: #ef4444;
    }

    .strength-fill.fair {
      background: #f97316;
    }

    .strength-fill.good {
      background: #eab308;
    }

    .strength-fill.strong {
      background: #4ade80;
    }

    .strength-label {
      font-size: 12px;
      color: var(--muted);
    }

    .strength-label.weak {
      color: #ef4444;
    }

    .strength-label.fair {
      color: #f97316;
    }

    .strength-label.good {
      color: #eab308;
    }

    .strength-label.strong {
      color: #4ade80;
    }

    .validation-error {
      color: var(--danger);
      font-size: 13px;
      margin-top: 6px;
    }

    @media (max-width: 768px) {
      .password-requirements {
        padding: 10px;
      }

      .requirement {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <a href="/">Driver Points</a>
        <span class="pill">Register</span>
      </div>
      <div class="navlinks">
        <a class="btn ghost" href="/about">About</a>
        <a class="btn ghost" href="/login.html">Login</a>
      </div>
    </div>

    <div class="card formcard">
      <h2 style="margin:0 0 6px">Create account</h2>
      <p class="small" style="margin:0 0 14px">Creates a user account with secure password encryption.</p>

      <form id="regForm">
        <div class="row">
          <div>
            <label>First name</label>
            <input name="first_name" autocomplete="given-name" />
          </div>
          <div>
            <label>Last name</label>
            <input name="last_name" autocomplete="family-name" />
          </div>
        </div>

        <label>Email</label>
        <input name="email" type="email" autocomplete="email" required />

        <label>Password</label>
        <input name="password" type="password" autocomplete="new-password" required id="passwordInput" />

        <!-- Password Requirements -->
        <div class="password-requirements" id="passwordRequirements">
          <div class="requirement" id="req-length">
            <span class="requirement-icon unmet">✗</span>
            <span>At least 8 characters</span>
          </div>
          <div class="requirement" id="req-uppercase">
            <span class="requirement-icon unmet">✗</span>
            <span>At least 1 uppercase letter (A-Z)</span>
          </div>
          <div class="requirement" id="req-lowercase">
            <span class="requirement-icon unmet">✗</span>
            <span>At least 1 lowercase letter (a-z)</span>
          </div>
          <div class="requirement" id="req-number">
            <span class="requirement-icon unmet">✗</span>
            <span>At least 1 number (0-9)</span>
          </div>
          <div class="requirement" id="req-special">
            <span class="requirement-icon unmet">✗</span>
            <span>At least 1 special character (!@#$%^&*)</span>
          </div>
        </div>

        <!-- Password Strength Meter -->
        <div class="strength-meter" id="strengthMeter">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <div class="strength-label" id="strengthLabel">Strength: Weak</div>
        </div>

        <!-- Validation Error -->
        <div class="validation-error" id="passwordError"></div>

        <div class="row" style="margin-top:12px">
          <button class="btn primary" type="submit" id="submitBtn">Create</button>
          <a class="btn" href="/">Cancel</a>
        </div>
        <div class="msg" id="msg" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <script src="/password-validator.js"></script>
  <script src="/app.js"></script>
  <script>
    const form = Team15.qs("#regForm");
    const msg = Team15.qs("#msg");
    const passwordInput = Team15.qs("#passwordInput");
    const passwordRequirements = Team15.qs("#passwordRequirements");
    const passwordError = Team15.qs("#passwordError");
    const strengthMeter = Team15.qs("#strengthMeter");
    const strengthFill = Team15.qs("#strengthFill");
    const strengthLabel = Team15.qs("#strengthLabel");
    const submitBtn = Team15.qs("#submitBtn");

    // Show/hide password requirements when user focuses on password field
    passwordInput.addEventListener("focus", () => {
      passwordRequirements.classList.add("show");
      strengthMeter.classList.add("show");
    });

    // Update requirements and strength meter as user types
    passwordInput.addEventListener("input", () => {
      const password = passwordInput.value;
      const validation = PasswordValidator.validatePassword(password);
      const strength = PasswordValidator.getPasswordStrength(password);
      const strengthLabel_ = PasswordValidator.getStrengthLabel(strength);

      // Update requirement indicators
      updateRequirement("length", password.length >= PasswordValidator.PASSWORD_RULES.minLength);
      updateRequirement("uppercase", /[A-Z]/.test(password));
      updateRequirement("lowercase", /[a-z]/.test(password));
      updateRequirement("number", /[0-9]/.test(password));
      updateRequirement("special", PasswordValidator.PASSWORD_RULES.specialChars.split('').some(char => password.includes(char)));

      // Update strength meter
      strengthFill.style.width = strength + "%";
      strengthFill.className = "strength-fill " + strengthLabel_.toLowerCase();
      strengthLabel.textContent = "Strength: " + strengthLabel_;
      strengthLabel.className = "strength-label " + strengthLabel_.toLowerCase();

      // Update error message
      if (validation.isValid) {
        passwordError.textContent = "";
        submitBtn.disabled = false;
      } else {
        passwordError.textContent = validation.errors[0]; // Show first error
        submitBtn.disabled = true;
      }
    });

    function updateRequirement(id, met) {
      const element = Team15.qs("#req-" + id);
      const icon = element.querySelector(".requirement-icon");
      
      if (met) {
        element.classList.add("met");
        icon.classList.remove("unmet");
        icon.classList.add("met");
        icon.textContent = "✓";
      } else {
        element.classList.remove("met");
        icon.classList.add("unmet");
        icon.classList.remove("met");
        icon.textContent = "✗";
      }
    }

    // Form submission
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      
      // Validate password before submission
      const password = passwordInput.value;
      const validation = PasswordValidator.validatePassword(password);
      
      if (!validation.isValid) {
        msg.textContent = validation.errors.join(", ");
        return;
      }

      submitBtn.disabled = true;
      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const res = await Team15.api("/api/register", { method: "POST", body: JSON.stringify(data) });
        window.location.href = res.redirect;
      } catch (err) {
        msg.textContent = err.message;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
