<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <a href="/">Driver Points</a>
        <span class="pill">Login</span>
      </div>
      <div class="navlinks">
        <a class="btn ghost" href="/about">About</a>
        <a class="btn ghost" href="/register.html">Register</a>
      </div>
    </div>

    <div class="card formcard">
      <h2 style="margin:0 0 6px">Sign in</h2>
      <p class="small" style="margin:0 0 14px">Use your email and password.</p>
      
      <form id="loginForm">
        <label>Email</label>
        <input name="email" type="email" autocomplete="email" required />
        
        <label>Password</label>
        <input name="password" type="password" autocomplete="current-password" required />
        
        <div class="row" style="margin-top:12px">
          <button class="btn primary" type="submit">Log in</button>
          <a class="btn" href="/">Cancel</a>
        </div>
        <p class="small" style="margin:10px 0 0"><a href="/change-password.html">Change password</a></p>
        <div class="msg" id="msg" aria-live="polite"></div>
      </form>
    </div>
  </div>

<script src="/app.js"></script>
<script>
  const form = Team15.qs("#loginForm");
  const msg = Team15.qs("#msg");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    const btn = form.querySelector("button");
    btn.disabled = true;
    const data = Object.fromEntries(new FormData(form).entries());
    try {
      const res = await Team15.api("/api/login", { method: "POST", body: JSON.stringify(data) });
      window.location.href = res.redirect;
    } catch (err) {
      msg.textContent = err.message;
      btn.disabled = false;
    }
  });
  </script>
</body>
</html>
