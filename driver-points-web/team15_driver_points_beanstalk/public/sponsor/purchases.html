<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sponsor Purchases</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <a href="/dashboard" class="brand-logo"><img src="/images/car-logo.png" alt="Driver Points" /></a>
        <span class="pill">Sponsor</span>
      </div>
      <div class="navlinks">
        <a class="btn ghost" href="/sponsor/dashboard.html">Dashboard</a>
        <a class="btn ghost" href="/sponsor/catalog.html">Catalog</a>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 6px">Purchase Management</h2>
      <div class="small">Review driver orders and update statuses without changing your working catalog or checkout flow.</div>
      <div class="msg" id="msg" style="margin-top:10px"></div>
    </div>

    <div class="card" style="margin-top:18px; overflow:auto">
      <table class="table" id="purchaseTable">
        <thead>
          <tr>
            <th>Purchase #</th>
            <th>Driver</th>
            <th>Status</th>
            <th>Points</th>
            <th>Items</th>
            <th>Created</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const tbody = Team15.qs('#purchaseTable tbody');
    const msg = Team15.qs('#msg');
    const statuses = ['PENDING', 'PROCESSING', 'COMPLETED', 'CANCELLED'];

    function fmtDate(v) { return v ? new Date(v).toLocaleString() : ''; }
    function esc(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function loadPurchases() {
      msg.textContent = '';
      tbody.innerHTML = '<tr><td colspan="7" class="small">Loading…</td></tr>';
      try {
        const data = await Team15.api('/api/sponsor/purchases', { method: 'GET' });
        const rows = data.purchases || [];
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="small">No purchases yet.</td></tr>';
          return;
        }
        tbody.innerHTML = rows.map(p => `
          <tr>
            <td>${p.purchase_id}</td>
            <td>${esc((p.first_name || '') + ' ' + (p.last_name || ''))}<br><span class="small">${esc(p.email || '')}</span></td>
            <td><strong>${esc(p.purchase_status || '')}</strong></td>
            <td>${Number(p.total_points || 0).toLocaleString()}</td>
            <td>${Number(p.item_count || 0)}</td>
            <td>${fmtDate(p.created_at)}</td>
            <td>
              <select class="input" data-id="${p.purchase_id}" style="min-width:160px">
                ${statuses.map(s => `<option value="${s}" ${s === p.purchase_status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
              <button class="btn" data-action="save" data-id="${p.purchase_id}">Save</button>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        msg.textContent = e.message;
        tbody.innerHTML = '<tr><td colspan="7" class="small">Failed to load purchases.</td></tr>';
      }
    }

    tbody.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action="save"]');
      if (!btn) return;
      const id = btn.dataset.id;
      const sel = tbody.querySelector(`select[data-id="${id}"]`);
      try {
        const data = await Team15.api(`/api/sponsor/purchases/${id}/status`, {
          method: 'PUT',
          body: JSON.stringify({ purchase_status: sel.value })
        });
        msg.textContent = data.refunded ? `Purchase #${id} updated to ${sel.value}. ${Number(data.total_points || 0).toLocaleString()} points refunded.` : `Purchase #${id} updated to ${sel.value}.`;
        await loadPurchases();
      } catch (err) {
        msg.textContent = err.message;
      }
    });

    Team15.qs('#logoutBtn').addEventListener('click', async () => {
      await Team15.api('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });

    (async function init() {
      const me = await Team15.loadMe();
      if (!me) return window.location.href = '/login.html';
      if (me.role !== 'sponsor') return window.location.href = `/${me.role}/dashboard.html`;
      if (Team15.mountProfileMenu) await Team15.mountProfileMenu('.navlinks');
      await loadPurchases();
    })();
  </script>
</body>
</html>
