<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sponsor Reports</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <a href="/dashboard" class="brand-logo"><img src="/images/car-logo.png" alt="Driver Points" /></a>
        <span class="pill">Sponsor</span>
      </div>
      <div class="navlinks">
        <a class="btn ghost" href="/sponsor/dashboard.html">Dashboard</a>
        <a class="btn ghost" href="/sponsor/purchases.html">Purchases</a>
        <a class="btn ghost" href="/change-password.html">Change Password</a>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 6px">Sponsor Reports</h2>
      <p class="sub">Read-only sponsor reports built on top of your existing balances, transactions, purchases, and summary views.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px">
        <button class="btn" data-r="balances">Driver Balances</button>
        <button class="btn" data-r="transactions">Point Transactions</button>
        <button class="btn" data-r="top-drivers">Top Drivers</button>
        <button class="btn" data-r="purchases">Purchase Summary</button>
        <button class="btn" data-r="invoice">Invoice Summary</button>
      </div>
      <div class="msg" id="msg" style="margin-top:10px"></div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3 style="margin:0 0 10px" id="title">Select a report</h3>
      <div style="overflow:auto">
        <table class="table" id="tbl">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const msg = Team15.qs('#msg');
    const title = Team15.qs('#title');
    const thead = Team15.qs('#tbl thead');
    const tbody = Team15.qs('#tbl tbody');

    function esc(s){
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderTable(rows){
      if(!rows || !rows.length){
        thead.innerHTML = '';
        tbody.innerHTML = `<tr><td class="small">No rows</td></tr>`;
        return;
      }
      const cols = Object.keys(rows[0]);
      thead.innerHTML = `<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`;
      tbody.innerHTML = rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('');
    }

    async function init(){
      const me = await Team15.loadMe();
      if(!me) return window.location.href='/login.html';
      if(me.role !== 'sponsor') return window.location.href=`/${me.role}/dashboard.html`;
      if (Team15.mountProfileMenu) await Team15.mountProfileMenu('.navlinks');
      if (Team15.mountImpersonationBanner) await Team15.mountImpersonationBanner();
    }

    document.addEventListener('click', async (e)=>{
      const btn = e.target.closest('button[data-r]');
      if(!btn) return;
      msg.textContent = '';
      const r = btn.getAttribute('data-r');
      try{
        if(r==='balances'){
          title.textContent = 'Driver Balances';
          const data = await Team15.api('/api/sponsor/driver-balances', {method:'GET'});
          renderTable(data.drivers);
        }
        if(r==='transactions'){
          title.textContent = 'Point Transactions';
          const data = await Team15.api('/api/sponsor/driver-point-transactions', {method:'GET'});
          renderTable(data.transactions);
        }
        if(r==='top-drivers'){
          title.textContent = 'Top Drivers';
          const data = await Team15.api('/api/sponsor/reports/top-drivers', {method:'GET'});
          renderTable(data.rows);
        }
        if(r==='purchases'){
          title.textContent = 'Purchase Summary';
          const data = await Team15.api('/api/sponsor/reports/purchase-summary', {method:'GET'});
          renderTable(data.rows);
        }
        if(r==='invoice'){
          title.textContent = 'Invoice Summary';
          const data = await Team15.api('/api/sponsor/reports/invoice-summary', {method:'GET'});
          renderTable(data.rows);
        }
      }catch(err){
        msg.textContent = err.message;
      }
    });

    Team15.qs('#logoutBtn').addEventListener('click', async ()=>{
      await Team15.api('/api/logout', {method:'POST'});
      window.location.href='/';
    });

    init();
  </script>
</body>
</html>
