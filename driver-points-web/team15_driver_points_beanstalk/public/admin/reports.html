<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Reports</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <a href="/dashboard" class="brand-logo"><img src="/images/car-logo.png" alt="Driver Points" /></a>
        <span class="pill">Admin</span>
      </div>
      <div class="navlinks">
        <a class="btn ghost" href="/admin/dashboard.html">Dashboard</a>
        <a class="btn ghost" href="/admin/audit-log.html">Audit Page</a>
        <a class="btn ghost" href="/change-password.html">Change Password</a>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 6px">Admin Reports</h2>
      <p class="sub">Summary and detailed reporting for sponsors, drivers, invoices, and audit activity.</p>

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px">
        <button class="btn" data-r="users">Users by Role</button>
        <button class="btn" data-r="drivers">Drivers</button>
        <button class="btn" data-r="points">Points Summary</button>
        <button class="btn" data-r="sales-sponsor">Sales by Sponsor</button>
        <button class="btn" data-r="sales-driver">Sales by Driver</button>
        <button class="btn" data-r="invoices">Sponsor Invoices</button>
        <button class="btn" data-r="audit">Audit Log</button>
      </div>

      <div class="row" style="margin-top:14px; gap:10px; align-items:end; flex-wrap:wrap">
        <div>
          <label for="orgIdFilter">Sponsor ID</label>
          <input id="orgIdFilter" type="number" min="1" placeholder="All sponsors" />
        </div>
        <div>
          <label for="driverIdFilter">Driver ID</label>
          <input id="driverIdFilter" type="number" min="1" placeholder="All drivers" />
        </div>
        <div>
          <label for="startDate">Start Date</label>
          <input id="startDate" type="date" />
        </div>
        <div>
          <label for="endDate">End Date</label>
          <input id="endDate" type="date" />
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap">
          <button class="btn" id="applyFiltersBtn" type="button">Apply Filters</button>
          <button class="btn ghost" id="downloadCsvBtn" type="button">Download CSV</button>
        </div>
      </div>

      <div class="msg" id="msg" style="margin-top:10px"></div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3 style="margin:0 0 10px" id="title">Select a report</h3>
      <div class="small" id="subtitle" style="margin-bottom:10px"></div>
      <div style="overflow:auto">
        <table class="table" id="tbl">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const msg = Team15.qs('#msg');
    const title = Team15.qs('#title');
    const subtitle = Team15.qs('#subtitle');
    const thead = Team15.qs('#tbl thead');
    const tbody = Team15.qs('#tbl tbody');
    const orgIdFilter = Team15.qs('#orgIdFilter');
    const driverIdFilter = Team15.qs('#driverIdFilter');
    const startDate = Team15.qs('#startDate');
    const endDate = Team15.qs('#endDate');

    let currentReport = null;
    let currentRows = [];
    let rawRows = [];

    function esc(s){
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderTable(rows){
      currentRows = Array.isArray(rows) ? rows : [];
      if(!currentRows.length){
        thead.innerHTML = '';
        tbody.innerHTML = `<tr><td class="small">No rows</td></tr>`;
        return;
      }
      const cols = Object.keys(currentRows[0]);
      thead.innerHTML = `<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`;
      tbody.innerHTML = currentRows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('');
    }

    function downloadCsv(rows, filename) {
      if (!rows || !rows.length) {
        msg.textContent = 'No report data to export.';
        return;
      }
      const cols = Object.keys(rows[0]);
      const csv = [
        cols.join(','),
        ...rows.map(row => cols.map(col => `"${String(row[col] ?? '').replace(/"/g, '""')}"`).join(','))
      ].join('\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function buildParams(reportType) {
      const params = new URLSearchParams();
      const orgId = orgIdFilter.value.trim();
      const driverId = driverIdFilter.value.trim();

      if (orgId) params.set('org_id', orgId);
      if (startDate.value) params.set('startDate', startDate.value);
      if (endDate.value) params.set('endDate', endDate.value);

      if ((reportType === 'sales-driver' || reportType === 'invoices') && driverId) {
        params.set('driver_user_id', driverId);
      }

      return params;
    }

    function parseDate(value) {
      if (!value) return null;
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function inDateRange(value) {
      const rowDate = parseDate(value);
      const start = startDate.value ? new Date(startDate.value + 'T00:00:00') : null;
      const end = endDate.value ? new Date(endDate.value + 'T23:59:59') : null;

      if (!rowDate) return true;
      if (start && rowDate < start) return false;
      if (end && rowDate > end) return false;
      return true;
    }

    function applyClientFilters(rows) {
      const orgId = orgIdFilter.value.trim();
      const driverId = driverIdFilter.value.trim();

      return (rows || []).filter((row) => {
        if (orgId) {
          const rowOrg = String(
            row.org_id ??
            row.sponsor_id ??
            row.orgId ??
            ''
          );
          if (rowOrg !== orgId) return false;
        }

        if (driverId) {
          const rowDriver = String(
            row.driver_user_id ??
            row.user_id ??
            row.driver_id ??
            row.userId ??
            ''
          );
          if (rowDriver !== driverId) return false;
        }

        const rowDate =
          row.created_at ??
          row.updated_at ??
          row.confirmed_at ??
          row.time_done ??
          row.application_date ??
          row.latest_event ??
          null;

        if ((startDate.value || endDate.value) && !inDateRange(rowDate)) {
          return false;
        }

        return true;
      });
    }

    function setRows(rows) {
      rawRows = Array.isArray(rows) ? rows : [];
      renderTable(applyClientFilters(rawRows));
    }

    async function loadReport(reportType){
      currentReport = reportType;
      msg.textContent = '';
      subtitle.textContent = '';

      try{
        if(reportType==='users'){
          title.textContent = 'Users by Role';
          subtitle.textContent = 'System-wide user counts by role.';
          const data = await Team15.api('/api/admin/reports/users-by-role', {method:'GET'});
          setRows(data.rows || []);
          return;
        }

        if(reportType==='drivers'){
          title.textContent = 'Drivers';
          subtitle.textContent = 'Driver roster with sponsor and balance information.';
          const data = await Team15.api('/api/admin/reports/drivers', {method:'GET'});
          setRows(data.rows || []);
          return;
        }

        if(reportType==='points'){
          title.textContent = 'Points Summary';
          subtitle.textContent = 'Current balances across drivers and sponsors.';
          const data = await Team15.api('/api/admin/reports/points', {method:'GET'});
          setRows((data.balances && data.balances.length) ? data.balances : (data.totals || []));
          return;
        }

        if(reportType==='sales-sponsor'){
          title.textContent = 'Sales by Sponsor';
          subtitle.textContent = 'Filtered report by sponsor and date range.';
          const params = buildParams(reportType).toString();
          const data = await Team15.api(`/api/admin/reports/sales-by-sponsor${params ? `?${params}` : ''}`, {method:'GET'});
          setRows(data.rows || []);
          return;
        }

        if(reportType==='sales-driver'){
          title.textContent = 'Sales by Driver';
          subtitle.textContent = 'Filtered report by sponsor, driver, and date range.';
          const params = buildParams(reportType).toString();
          const data = await Team15.api(`/api/admin/reports/sales-by-driver${params ? `?${params}` : ''}`, {method:'GET'});
          setRows(data.rows || []);
          return;
        }

        if(reportType==='invoices'){
          title.textContent = 'Sponsor Invoices';
          subtitle.textContent = 'One row per driver within a sponsor invoice. Includes fee by driver and total fee due for sponsor.';
          const params = buildParams(reportType).toString();
          const data = await Team15.api(`/api/admin/reports/invoices${params ? `?${params}` : ''}`, {method:'GET'});
          setRows(data.rows || []);
          return;
        }

        if(reportType==='audit'){
          title.textContent = 'Audit Log';
          subtitle.textContent = 'Filtered by sponsor and date range.';
          const params = buildParams(reportType).toString();
          const data = await Team15.api(`/api/admin/audit-log${params ? `?${params}` : ''}`, {method:'GET'});
          setRows(data.audit_logs || []);
          return;
        }
      }catch(err){
        msg.textContent = err.message;
      }
    }

    async function init(){
      const me = await Team15.loadMe();
      if(!me) return window.location.href='/login.html';
      if(me.role !== 'admin') return window.location.href=`/${me.role}/dashboard.html`;
      if (Team15.mountProfileMenu) await Team15.mountProfileMenu('.navlinks');
      if (Team15.mountImpersonationBanner) await Team15.mountImpersonationBanner();
    }

    document.addEventListener('click', async (e)=>{
      const btn = e.target.closest('button[data-r]');
      if(!btn) return;
      await loadReport(btn.getAttribute('data-r'));
    });

    Team15.qs('#applyFiltersBtn').addEventListener('click', async ()=>{
      if(!currentReport){
        msg.textContent = 'Select a report first.';
        return;
      }
      await loadReport(currentReport);
    });

    Team15.qs('#downloadCsvBtn').addEventListener('click', ()=>{
      if(!currentReport || !currentRows.length){
        msg.textContent = 'Load a report first.';
        return;
      }
      downloadCsv(currentRows, `admin_${currentReport}_report.csv`);
    });

    Team15.qs('#logoutBtn').addEventListener('click', async ()=>{
      await Team15.api('/api/logout', {method:'POST'});
      window.location.href='/';
    });

    init();
  </script>
</body>
</html>
