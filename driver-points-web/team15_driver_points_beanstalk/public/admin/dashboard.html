<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <a href="/">Driver Points</a>
        <span class="pill">Admin</span>
      </div>
      <div class="navlinks">
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 6px">Admin Dashboard</h2>
      <div class="small" id="welcome"></div>

      <div class="kpi" style="margin-top:12px">
        <div class="box">
          <div class="small">Total Users</div>
          <div style="font-size:30px; font-weight:800" id="users">—</div>
        </div>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const welcome = Team15.qs("#welcome");
    const usersEl = Team15.qs("#users");
    const msg = Team15.qs("#msg");

    async function init() {
      const me = await Team15.loadMe();
      if (!me) return window.location.href = "/login.html";
      if (me.role !== "admin") return window.location.href = `/${me.role}/dashboard.html`;
      welcome.textContent = `Signed in as ${me.email}`;

      try {
        const data = await Team15.api("/api/admin/stats", { method: "GET" });
        usersEl.textContent = data.users;
      } catch (e) {
        msg.textContent = e.message;
      }
    }

    Team15.qs("#logoutBtn").addEventListener("click", async () => {
      await Team15.api("/api/logout", { method: "POST" });
      window.location.href = "/";
    });

    init();
  </script>
</body>
</html>
