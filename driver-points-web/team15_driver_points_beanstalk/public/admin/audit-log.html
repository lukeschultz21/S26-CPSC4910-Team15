<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Audit Log</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <a href="/admin/dashboard.html" class="brand-logo">
          <img src="/images/car-logo.png" alt="Driver Points" />
        </a>
        <span class="pill">Admin</span>
      </div>
      <div class="navlinks">
        <a class="btn ghost" href="/admin/dashboard.html">Back</a>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 6px">Audit Log</h2>
      <div class="small" id="subtitle"></div>
      <div class="msg" id="msg" style="margin-top:10px"></div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3 style="margin:0 0 10px">Filters</h3>
      <div class="row">
        <div>
          <label>Start Date</label>
          <input type="date" id="startDate">
        </div>

        <div>
          <label>End Date</label>
          <input type="date" id="endDate">
        </div>

        <div>
          <label>Action Type</label>
          <select id="actionType">
            <option value="">All</option>
            <option value="POINT_CHANGE">POINT_CHANGE</option>
            <option value="LOGIN_ATTEMPT">LOGIN_ATTEMPT</option>
            <option value="PASSWORD_CHANGE">PASSWORD_CHANGE</option>
            <option value="DRIVER_APP_SUBMITTED">DRIVER_APP_SUBMITTED</option>
            <option value="DRIVER_APP_STATUS_CHANGE">DRIVER_APP_STATUS_CHANGE</option>
          </select>
        </div>

        <div style="align-self:flex-end; display:flex; gap:10px;">
          <button class="btn" id="filterBtn">Apply Filter</button>
          <button class="btn ghost small-btn" id="downloadCsvBtn">CSV</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:18px">
      <div style="overflow-x:auto;">
        <table class="table" id="auditTable">
          <thead>
            <tr>
              <th>Time</th>
              <th>Action</th>
              <th>Actor</th>
              <th>Actee</th>
              <th>Entity</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const subtitle = Team15.qs("#subtitle");
    const msg = Team15.qs("#msg");
    const tbody = Team15.qs("#auditTable tbody");
    let currentAuditLogs = [];

    function fmtDate(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleString();
    }

    function fmtDetails(details) {
      if (!details) return "";
      if (typeof details === "string") return details;
      try {
        return JSON.stringify(details);
      } catch {
        return "";
      }
    }

    function downloadAuditCsv() {
      if (!currentAuditLogs.length) {
        msg.textContent = "No audit log data to export.";
        return;
      }

      const headers = [
        "Time",
        "Action",
        "Actor",
        "Actee",
        "Org ID",
        "Entity Type",
        "Entity ID",
        "Success",
        "Details",
        "Notes"
      ];

      const rows = currentAuditLogs.map(log => {
        const actor = `${log.actor_first_name || ""} ${log.actor_last_name || ""}`.trim() || log.actor_email || log.actor_user_id || "";
        const actee = log.actee_email || log.actee_user_id || "";
        const details = typeof log.details === "string" ? log.details : JSON.stringify(log.details || "");

        return [
          log.time_done || "",
          log.action_type || "",
          actor,
          actee,
          log.org_id || "",
          log.entity_type || "",
          log.entity_id || "",
          log.success == null ? "" : log.success,
          details,
          log.notes || ""
        ];
      });

      const csv = [headers, ...rows]
        .map(row =>
          row
            .map(value => `"${String(value).replace(/"/g, '""')}"`)
            .join(",")
        )
        .join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "audit_log_report.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }

    async function loadAuditLogs(filters = {}) {
      try {
        let url = "/api/admin/audit-log";
        const params = new URLSearchParams(filters);

        if (params.toString()) {
          url += "?" + params.toString();
        }

        const data = await Team15.api(url, { method: "GET" });
        const logs = data.audit_logs || [];
        currentAuditLogs = logs;

        if (!logs.length) {
          msg.textContent = "No audit log entries found.";
          tbody.innerHTML = "";
          return;
        }

        msg.textContent = "";

        tbody.innerHTML = logs.map(log => {
          const actor = `${log.actor_first_name || ""} ${log.actor_last_name || ""}`.trim() || log.actor_email || log.actor_user_id || "";
          const actee = log.actee_email || log.actee_user_id || "";
          const entity = `${log.entity_type || ""}${log.entity_id ? ` #${log.entity_id}` : ""}`;

          return `
            <tr>
              <td>${fmtDate(log.time_done)}</td>
              <td>${log.action_type || ""}</td>
              <td>${actor}</td>
              <td>${actee}</td>
              <td>${entity}</td>
              <td>${fmtDetails(log.details)}</td>
            </tr>
          `;
        }).join("");
      } catch (e) {
        msg.textContent = e.message;
      }
    }

    async function init() {
      const me = await Team15.loadMe();
      if (!me) return window.location.href = "/login.html";
      if (me.role !== "admin") return window.location.href = `/${me.role}/dashboard.html`;

      subtitle.textContent = `Signed in as ${me.email}`;
      await loadAuditLogs();
    }

    Team15.qs("#filterBtn").addEventListener("click", () => {
      const startDate = Team15.qs("#startDate").value;
      const endDate = Team15.qs("#endDate").value;
      const actionType = Team15.qs("#actionType").value;

      const filters = {};
      if (startDate) filters.startDate = startDate;
      if (endDate) filters.endDate = endDate;
      if (actionType) filters.actionType = actionType;

      loadAuditLogs(filters);
    });

    Team15.qs("#downloadCsvBtn").addEventListener("click", () => {
      downloadAuditCsv();
    });

    Team15.qs("#logoutBtn").addEventListener("click", async () => {
      await Team15.api("/api/logout", { method: "POST" });
      window.location.href = "/";
    });

    init();
  </script>
</body>
</html>
