<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Driver Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <a href="/">Driver Points</a>
        <span class="pill">Driver</span>
      </div>
      <div class="navlinks">
        <a class="btn ghost" href="/change-password.html">Change Password</a>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </div>

<div class="card">
  <h2 style="margin:0 0 6px">Driver Dashboard</h2>
  <div class="small" id="welcome"></div>
</div>

<!-- Current Points Display Section -->
<div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
  <h3 style="margin: 0 0 8px 0; font-size: 14px; opacity: 0.9;">Current Points Balance</h3>
  <div style="font-size: 48px; font-weight: bold; margin: 8px 0;" id="pointsAmount">0</div>
</div>

<!-- Lifetime Points Display Section -->
<div style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 24px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
  <h3 style="margin: 0 0 8px 0; font-size: 14px; opacity: 0.9;">Lifetime Points Earned</h3>
  <div style="font-size: 48px; font-weight: bold; margin: 8px 0;" id="lifetimePoints">0</div>
</div>

<!-- Conversion Rate Display Section -->
<div style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 24px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
  <h3 style="margin: 0 0 8px 0; font-size: 14px; opacity: 0.9;">Points to Dollar Conversion</h3>
  <div style="font-size: 24px; font-weight: bold; margin: 8px 0;" id="conversionRate">Loading...</div>
</div>

<div class="card" style="margin-top:18px">
  <h3 style="margin:0 0 6px">Recent Transactions</h3>
  <div class="small">Latest 25 point transactions.</div>
  <table class="table" id="txTable">
    <thead>
      <tr><th>Date</th><th>Points</th><th>Description</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <div class="msg" id="msg"></div>
</div>

  <script src="/app.js"></script>
  <script>
    const welcome = Team15.qs("#welcome");
    const pointsEl = Team15.qs("#pointsAmount");
    const lifetimeEl = Team15.qs("#lifetimePoints");
    const conversionEl = Team15.qs("#conversionRate");
    const tbody = Team15.qs("#txTable tbody");
    const msg = Team15.qs("#msg");

    function renderRow(tx) {
      const date = tx.transaction_date || tx.created_at || tx.date || "";
      const pts = (tx.points_delta ?? tx.points ?? tx.amount ?? "");
      const desc = tx.description || tx.reason || tx.memo || "";
      return `<tr><td>${date}</td><td>${pts}</td><td>${desc}</td></tr>`;
    }

    async function init() {
      const me = await Team15.loadMe();
      if (!me) return window.location.href = "/login.html";
      if (me.role !== "driver") return window.location.href = `/${me.role}/dashboard.html`;

      welcome.textContent = `Signed in as ${me.email}`;

      try {
        const p = await Team15.api("/api/driver/points", { method: "GET" });
        pointsEl.textContent = p.current_points;
      } catch (e) {
        msg.textContent = e.message;
      }

      try {
        const t = await Team15.api("/api/driver/total-points", { method: "GET" });
        lifetimeEl.textContent = t.total_points;
      } catch (e) {
        msg.textContent = e.message;
      }

      try {
        const c = await Team15.api("/api/driver/conversion-rate", { method: "GET" });
        conversionEl.textContent = `${c.conversion_rate} points = $1`;
      } catch (e) {
        msg.textContent = e.message;
      }

      try {
        const t = await Team15.api("/api/driver/transactions", { method: "GET" });
        tbody.innerHTML = (t.transactions || []).map(renderRow).join("");
      } catch (e) {
        msg.textContent = e.message;
      }
    }

    Team15.qs("#logoutBtn").addEventListener("click", async () => {
      await Team15.api("/api/logout", { method: "POST" });
      window.location.href = "/";
    });

    init();
  </script>
</body>
</html>
