<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Driver Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <a href="/">Driver Points</a>
        <span class="pill">Driver</span>
      </div>
      <div class="navlinks">
        <a class="btn ghost" href="/change-password.html">Change Password</a>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 6px">Dashboard</h2>
      <div class="small" id="welcome"></div>

      <div class="kpi" style="margin-top:12px">
        <div class="box">
          <div class="small">Current Points</div>
          <div style="font-size:30px; font-weight:800" id="points">—</div>
          <div class="small" id="dollarValue" style="color:var(--muted); margin-top:4px">—</div>
        </div>
        <div class="box">
          <div class="small">Lifetime Points Earned</div>
          <div style="font-size:30px; font-weight:800" id="lifetimePoints">—</div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3 style="margin:0 0 6px">Recent Transactions</h3>
      <div class="small">Latest 25 point transactions.</div>
      <table class="table" id="txTable">
        <thead>
          <tr><th>Date</th><th>Points</th><th>Description</th><th>Actor</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const welcome = Team15.qs("#welcome");
    const pointsEl = Team15.qs("#points");
    const lifetimePointsEl = Team15.qs("#lifetimePoints");
    const dollarValueEl = Team15.qs("#dollarValue");
    const tbody = Team15.qs("#txTable tbody");
    const msg = Team15.qs("#msg");

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      return d.toLocaleDateString() + " " + d.toLocaleTimeString();
    }

    function renderRow(tx) {
      const date = formatDate(tx.transaction_date || tx.created_at || tx.date);
      const pts = (tx.point_change ?? tx.points_delta ?? tx.points ?? tx.amount ?? "");
      const desc = tx.description || tx.reason || tx.memo || "";
      const actor = tx.actor_name || tx.actor_email || "System";
      return `<tr><td>${date}</td><td>${pts}</td><td>${desc}</td><td>${actor}</td></tr>`;
    }

    async function init() {
      const me = await Team15.loadMe();
      if (!me) return window.location.href = "/login.html";
      if (me.role !== "driver") return window.location.href = `/${me.role}/dashboard.html`;

      welcome.textContent = `Signed in as ${me.email}`;

      try {
        const p = await Team15.api("/api/driver/points", { method: "GET" });
        pointsEl.textContent = p.current_points.toLocaleString();
        lifetimePointsEl.textContent = p.lifetime_points.toLocaleString();
        dollarValueEl.textContent = `≈ $${p.dollar_value.toFixed(2)} (${p.cents_per_point}¢ per point)`;
      } catch (e) {
        msg.textContent = e.message;
      }

      try {
        const t = await Team15.api("/api/driver/transactions", { method: "GET" });
        tbody.innerHTML = (t.transactions || []).map(renderRow).join("");
      } catch (e) {
        msg.textContent = e.message;
      }
    }

    Team15.qs("#logoutBtn").addEventListener("click", async () => {
      await Team15.api("/api/logout", { method: "POST" });
      window.location.href = "/";
    });

    init();
  </script>
</body>
</html>
